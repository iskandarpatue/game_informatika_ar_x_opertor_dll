<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuis Literasi Digital: Tangkap Jawabannya!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        body { font-family: 'Poppins', sans-serif; margin: 0; overflow: hidden; background-color: #000; }
        
        /* Kamera Cermin */
        #webcam-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; transform: scaleX(-1);
        }

        /* Lapisan Antarmuka */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: none; /* Agar tidak memblokir klik ke elemen di bawahnya */
        }
        .interactive { pointer-events: auto; }
        .hidden { display: none !important; }

        /* Panel Glassmorphism Utama */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border: 2px solid #38bdf8; border-radius: 20px;
            width: 90%; max-width: 600px; padding: 30px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        /* Tampilan Soal di Atas */
        #soal-panel {
            position: absolute; top: 5%; width: 90%; max-width: 800px;
            background: rgba(255, 255, 255, 0.95); border-radius: 15px; padding: 15px 25px;
            border-bottom: 5px solid #0ea5e9; box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .btn {
            background: #0ea5e9; color: white; padding: 15px 30px; border-radius: 12px;
            font-size: 1.2rem; font-weight: bold; width: 100%; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: #0284c7; }
        .btn:active { transform: scale(0.95); }

        /* Wadah untuk Balok yang Jatuh */
        #falling-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; overflow: hidden;
        }

        /* Desain Kotak Jawaban yang Jatuh */
        .falling-box {
            position: absolute; pointer-events: auto; cursor: pointer;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white; font-weight: 800; font-size: 1.1rem;
            padding: 20px; border-radius: 15px; text-align: center;
            width: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 3px solid rgba(255,255,255,0.5);
            animation: fallAnimation linear infinite;
        }
        
        .falling-box:active { transform: scale(0.9); }

        @keyframes fallAnimation {
            0% { top: -150px; }
            100% { top: 110%; }
        }

        /* Notifikasi Tengah Layar */
        #feedback-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4rem; font-weight: 900; padding: 20px 50px; border-radius: 20px;
            text-transform: uppercase; letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <video id="webcam-bg" autoplay playsinline muted></video>

    <!-- Tempat kotak jawaban berjatuhan -->
    <div id="falling-container"></div>

    <div id="ui-layer">
        
        <!-- Layar Mulai -->
        <div id="screen-start" class="glass-panel interactive">
            <h1 class="text-3xl font-bold text-sky-600 mb-2">Game AR: Literasi Digital</h1>
            <p class="text-gray-600 mb-6">Pilih jawaban yang benar dengan mengetuk kotak yang melayang jatuh.</p>
            <input type="text" id="input-nama" class="w-full px-4 py-3 border-2 border-sky-200 rounded-xl mb-4 text-center text-lg focus:outline-none focus:border-sky-500" placeholder="Ketik Nama Siswa...">
            <button class="btn" onclick="mulaiGame()">MULAI TANTANGAN</button>
        </div>

        <!-- Panel Soal -->
        <div id="soal-panel" class="hidden interactive">
            <div class="flex justify-between items-center mb-2 border-b-2 border-gray-100 pb-2">
                <span id="quiz-progress" class="font-bold text-sky-600 bg-sky-100 px-3 py-1 rounded-full text-sm">Soal 1/5</span>
                <span id="quiz-score" class="font-bold text-gray-700">Skor: 0</span>
            </div>
            <h2 id="question-text" class="text-xl md:text-2xl font-bold text-gray-800">Teks soal akan muncul di sini...</h2>
        </div>

        <!-- Pesan Umpan Balik -->
        <div id="feedback-msg" class="hidden interactive"></div>

        <!-- Tombol Lanjut -->
        <div id="btn-next-container" class="hidden interactive" style="position: absolute; bottom: 5%;">
            <button class="btn" onclick="soalSelanjutnya()">LANJUT SOAL BERIKUTNYA</button>
        </div>

        <!-- Layar Hasil -->
        <div id="screen-result" class="glass-panel hidden interactive">
            <h1 class="text-4xl font-bold text-sky-600 mb-2">Misi Selesai!</h1>
            <p id="result-name" class="text-xl font-bold text-gray-700 mb-6">Hebat, [Nama]!</p>
            
            <div class="flex justify-around mb-6">
                <div class="bg-green-100 p-4 rounded-xl w-5/12 border-2 border-green-300">
                    <p class="text-green-700 font-bold">Benar</p>
                    <p id="result-benar" class="text-4xl font-extrabold text-green-600">0</p>
                </div>
                <div class="bg-red-100 p-4 rounded-xl w-5/12 border-2 border-red-300">
                    <p class="text-red-700 font-bold">Salah</p>
                    <p id="result-salah" class="text-4xl font-extrabold text-red-600">0</p>
                </div>
            </div>
            
            <div class="bg-sky-50 border-4 border-sky-400 p-4 rounded-2xl mb-6">
                <p class="text-sky-800 font-bold">NILAI AKHIR</p>
                <p id="result-nilai" class="text-6xl font-extrabold text-sky-500">100</p>
            </div>
            
            <button class="btn" onclick="location.reload()">COBA LAGI</button>
        </div>
    </div>

    <script>
        // Akses Webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { document.getElementById('webcam-bg').srcObject = stream; })
            .catch(err => { console.warn("Kamera ditolak/tidak ada."); });

        const questions = [
            { question: "Operator untuk mengecualikan kata tertentu dari hasil pencarian adalah...", options: [{ text: "AND", correct: false }, { text: "OR", correct: false }, { text: "NOT / (-)", correct: true }, { text: "site:", correct: false }] },
            { question: "Langkah pertama yang paling krusial dalam Membaca Lateral adalah...", options: [{ text: "Buka Tab Baru", correct: false }, { text: "Berhenti Sejenak", correct: true }, { text: "Cek Penulis", correct: false }, { text: "Simpulkan", correct: false }] },
            { question: "Membatasi hasil pencarian hanya pada situs resmi pemerintah, gunakan operator...", options: [{ text: "AND", correct: false }, { text: "OR", correct: false }, { text: "site:go.id", correct: true }, { text: "filetype:", correct: false }] },
            { question: "Tujuan utama Membaca Lateral adalah...", options: [{ text: "Membaca vertikal", correct: false }, { text: "Mencari typo", correct: false }, { text: "Bandingkan dgn sumber lain", correct: true }, { text: "Cari gambar", correct: false }] },
            { question: "Manakah ciri domain situs yang paling kredibel?", options: [{ text: "Blog Pribadi", correct: false }, { text: ".go.id / .ac.id", correct: true }, { text: "Anonim", correct: false }, { text: "Sosial Media", correct: false }] }
        ];

        let currentQuestion = 0, score = 0, benar = 0, salah = 0, playerName = "", isAnswering = false;
        let fallIntervals = [];

        function mulaiGame() {
            playerName = document.getElementById('input-nama').value || "Siswa";
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('soal-panel').classList.remove('hidden');
            tampilkanSoal();
        }

        function tampilkanSoal() {
            isAnswering = true;
            document.getElementById('btn-next-container').classList.add('hidden');
            document.getElementById('feedback-msg').classList.add('hidden');
            
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('quiz-progress').innerText = `Soal ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('quiz-score').innerText = `Skor: ${Math.round(score)}`;

            const container = document.getElementById('falling-container');
            container.innerHTML = "";
            
            // Pengaturan posisi horizontal (20%, 40%, 60%, 80% dari lebar layar)
            const leftPositions = [10, 35, 60, 80];
            const shuffledOptions = q.options.sort(() => Math.random() - 0.5);

            shuffledOptions.forEach((opt, index) => {
                const box = document.createElement('div');
                box.className = "falling-box";
                box.innerText = opt.text;
                
                // Set posisi X secara persentase agar responsif di layar lebar PID maupun laptop
                box.style.left = `calc(${leftPositions[index]}% - 110px)`; 
                
                // Acak sedikit durasi jatuhnya agar tidak berbarengan (antara 6 sampai 9 detik)
                const duration = Math.random() * 3 + 6;
                box.style.animationDuration = `${duration}s`;
                
                // Tambahkan delay agar turunnya bergantian
                box.style.animationDelay = `${index * 0.5}s`;

                box.onclick = () => {
                    if(!isAnswering) return;
                    cekJawaban(opt.correct, box);
                };

                container.appendChild(box);
            });
        }

        function cekJawaban(isCorrect, clickedBox) {
            isAnswering = false;
            document.getElementById('falling-container').innerHTML = ""; // Hapus semua kotak

            const feedback = document.getElementById('feedback-msg');
            feedback.classList.remove('hidden');

            if (isCorrect) {
                benar++;
                score += (100 / questions.length);
                feedback.innerText = "BENAR! 🎉";
                feedback.style.color = "#10b981";
                feedback.style.background = "rgba(255,255,255,0.9)";
            } else {
                salah++;
                feedback.innerText = "SALAH! ❌";
                feedback.style.color = "#ef4444";
                feedback.style.background = "rgba(255,255,255,0.9)";
            }

            document.getElementById('quiz-score').innerText = `Skor: ${Math.round(score)}`;
            document.getElementById('btn-next-container').classList.remove('hidden');
        }

        function soalSelanjutnya() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                tampilkanSoal();
            } else {
                tampilkanHasil();
            }
        }

        function tampilkanHasil() {
            document.getElementById('soal-panel').classList.add('hidden');
            document.getElementById('btn-next-container').classList.add('hidden');
            document.getElementById('feedback-msg').classList.add('hidden');
            
            const resultScreen = document.getElementById('screen-result');
            resultScreen.classList.remove('hidden');

            document.getElementById('result-name').innerText = `Hebat, ${playerName}!`;
            document.getElementById('result-benar').innerText = benar;
            document.getElementById('result-salah').innerText = salah;
            document.getElementById('result-nilai').innerText = Math.round(score);
        }
    </script>
</body>
</html>

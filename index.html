<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Layar Sentuh: Kuis Literasi Digital</title>
    <!-- Library A-Frame untuk 3D -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- Library CSS (Tailwind) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; margin: 0; overflow: hidden; background-color: #000; }
        
        /* Video Webcam sebagai Background */
        #webcam-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1;
            transform: scaleX(-1); /* Efek Cermin agar gerakan siswa natural */
        }

        /* UI HTML Overlay */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .interactive { pointer-events: auto; }
        .hidden { display: none !important; }
        
        /* Panel Soal di Atas */
        #soal-panel {
            position: absolute; top: 5%; width: 80%; max-width: 800px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px);
            border: 3px solid #0ea5e9; border-radius: 20px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center;
        }

        /* Panel Glassmorphism Umum */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
            border: 2px solid #38bdf8; border-radius: 20px;
            width: 90%; max-width: 500px; padding: 30px; text-align: center;
        }

        .btn {
            background: #0ea5e9; color: white; padding: 15px 30px; border-radius: 12px;
            font-size: 1.2rem; font-weight: bold; width: 100%; border: none; cursor: pointer;
            box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4); transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        
        /* Pesan Umpan Balik (Tengah Layar) */
        #feedback-msg {
            position: absolute; top: 40%; font-size: 3rem; font-weight: 800;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5); padding: 20px 40px; border-radius: 20px;
            transition: all 0.3s;
        }
    </style>
</head>
<body>

    <!-- 1. Video Latar Belakang (Kamera PID) -->
    <video id="webcam-bg" autoplay playsinline muted></video>

    <!-- 2. Scene 3D A-Frame (Background transparan) -->
    <a-scene renderer="alpha: true" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        <!-- Kamera tetap -->
        <a-entity camera position="0 1.6 3" look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>
        
        <!-- Wadah untuk memunculkan balok jawaban yang jatuh -->
        <a-entity id="answers-container"></a-entity>
    </a-scene>

    <!-- 3. Antarmuka Layar (UI Overlay) -->
    <div id="ui-layer">
        
        <!-- Layar Mulai -->
        <div id="screen-start" class="glass-panel interactive">
            <h1 class="text-3xl font-bold text-sky-600 mb-2">Tepuk Jawabannya!</h1>
            <p class="text-gray-600 mb-6">Pilih jawaban yang benar dengan menyentuh kotak yang jatuh di layar sentuh PID.</p>
            <input type="text" id="input-nama" class="w-full px-4 py-3 border-2 border-sky-200 rounded-xl mb-4 text-center text-lg" placeholder="Ketik Nama Anda...">
            <button class="btn" onclick="mulaiGame()">MULAI TANTANGAN</button>
        </div>

        <!-- Layar Soal (Mengambang di atas) -->
        <div id="soal-panel" class="hidden interactive">
            <div class="flex justify-between items-center mb-3 border-b-2 border-gray-200 pb-2">
                <span id="quiz-progress" class="font-bold text-sky-600">Soal 1/5</span>
                <span id="quiz-score" class="font-bold text-gray-700">Skor: 0</span>
            </div>
            <h2 id="question-text" class="text-xl md:text-2xl font-bold text-gray-800">Teks soal akan muncul di sini...</h2>
        </div>

        <!-- Umpan Balik (Benar/Salah) -->
        <div id="feedback-msg" class="hidden">BENAR!</div>

        <!-- Tombol Lanjut (Muncul setelah menjawab) -->
        <div id="btn-next-container" class="hidden interactive" style="position: absolute; bottom: 10%;">
            <button id="btn-lanjut" class="btn" onclick="soalSelanjutnya()">LANJUT SOAL BERIKUTNYA</button>
        </div>

        <!-- Layar Hasil Akhir -->
        <div id="screen-result" class="glass-panel hidden interactive">
            <h1 class="text-3xl font-bold text-sky-600 mb-2">Selesai!</h1>
            <p id="result-name" class="text-xl font-bold text-gray-700 mb-4">Hebat, [Nama]!</p>
            
            <div class="flex justify-around mb-6">
                <div class="bg-green-100 p-4 rounded-xl w-5/12 border-2 border-green-300">
                    <p class="text-green-700 font-bold">Benar</p>
                    <p id="result-benar" class="text-4xl font-extrabold text-green-600">0</p>
                </div>
                <div class="bg-red-100 p-4 rounded-xl w-5/12 border-2 border-red-300">
                    <p class="text-red-700 font-bold">Salah</p>
                    <p id="result-salah" class="text-4xl font-extrabold text-red-600">0</p>
                </div>
            </div>
            
            <div class="bg-sky-50 border-4 border-sky-400 p-4 rounded-2xl mb-6">
                <p class="text-sky-800 font-bold">NILAI AKHIR</p>
                <p id="result-nilai" class="text-6xl font-extrabold text-sky-500">100</p>
            </div>
            
            <button class="btn mb-3" onclick="location.reload()">MAIN LAGI</button>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        // Mengaktifkan Kamera PID (Background)
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                document.getElementById('webcam-bg').srcObject = stream;
            })
            .catch(function(err) {
                alert("Kamera tidak ditemukan atau izin ditolak. Game akan berlanjut dengan latar hitam.");
            });

        // Database Soal (Disesuaikan agar teks jawaban tidak terlalu panjang untuk kotak jatuh)
        const questions = [
            {
                question: "Operator untuk mengecualikan kata tertentu dari hasil pencarian adalah...",
                options: [
                    { text: "AND", correct: false },
                    { text: "OR", correct: false },
                    { text: "NOT / (-)", correct: true },
                    { text: "site:", correct: false }
                ]
            },
            {
                question: "Langkah pertama yang paling krusial dalam Membaca Lateral adalah...",
                options: [
                    { text: "Buka Tab Baru", correct: false },
                    { text: "Berhenti Sejenak", correct: true },
                    { text: "Cek Penulis", correct: false },
                    { text: "Simpulkan", correct: false }
                ]
            },
            {
                question: "Membatasi hasil pencarian hanya pada situs resmi pemerintah, gunakan operator...",
                options: [
                    { text: "AND", correct: false },
                    { text: "OR", correct: false },
                    { text: "site:go.id", correct: true },
                    { text: "filetype:", correct: false }
                ]
            },
            {
                question: "Tujuan utama Membaca Lateral adalah...",
                options: [
                    { text: "Membaca dari atas ke bawah", correct: false },
                    { text: "Mencari salah ketik", correct: false },
                    { text: "Membaca cepat", correct: false },
                    { text: "Bandingkan dgn sumber lain", correct: true }
                ]
            },
            {
                question: "Manakah ciri domain situs yang paling kredibel?",
                options: [
                    { text: "Blog Pribadi", correct: false },
                    { text: "Anonim", correct: false },
                    { text: ".go.id / .ac.id", correct: true },
                    { text: "Sosial Media", correct: false }
                ]
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let benar = 0;
        let salah = 0;
        let playerName = "";
        let isAnswering = false;

        function mulaiGame() {
            const input = document.getElementById('input-nama').value;
            if (input.trim() === "") {
                alert("Silakan masukkan nama Anda!");
                return;
            }
            playerName = input;
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('soal-panel').classList.remove('hidden');
            tampilkanSoal();
        }

        function tampilkanSoal() {
            isAnswering = true;
            document.getElementById('btn-next-container').classList.add('hidden');
            document.getElementById('feedback-msg').classList.add('hidden');
            
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('quiz-progress').innerText = `Soal ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('quiz-score').innerText = `Skor: ${Math.round(score)}`;

            const container = document.getElementById('answers-container');
            container.innerHTML = ""; // Bersihkan blok sebelumnya

            // Pengaturan posisi horizontal (menyebar di layar)
            const positions = [-2.5, -0.8, 0.8, 2.5];
            
            // Acak posisi jawaban
            const shuffledOptions = q.options.sort(() => Math.random() - 0.5);

            shuffledOptions.forEach((opt, index) => {
                // Membuat entitas blok jawaban 3D
                const entity = document.createElement('a-entity');
                
                // Mulai dari atas (Y=5) ke bawah (Y=-5)
                entity.setAttribute('position', `${positions[index]} 5 -3`);
                
                // Tampilan Visual Balok
                entity.setAttribute('geometry', 'primitive: box; width: 1.5; height: 0.8; depth: 0.2');
                entity.setAttribute('material', 'color: #0ea5e9; opacity: 0.9');
                entity.setAttribute('class', 'clickable'); // Supaya bisa disentuh PID
                
                // Teks Jawaban pada balok
                const textEl = document.createElement('a-text');
                textEl.setAttribute('value', opt.text);
                textEl.setAttribute('align', 'center');
                textEl.setAttribute('width', '4');
                textEl.setAttribute('position', '0 0 0.11'); // Letakkan sedikit di depan balok
                textEl.setAttribute('color', '#ffffff');
                entity.appendChild(textEl);

                // Animasi Jatuh Ke Bawah
                // Balok akan jatuh berulang-ulang sampai siswa menyentuhnya
                entity.setAttribute('animation', `property: position; to: ${positions[index]} -4 -3; dur: 8000; loop: true; easing: linear`);
                
                // Interaksi Saat Disentuh (Tap Layar PID)
                entity.addEventListener('click', function() {
                    if(!isAnswering) return;
                    cekJawaban(opt.correct, opt.text);
                });

                container.appendChild(entity);
            });
        }

        function cekJawaban(isCorrect, answerText) {
            isAnswering = false; // Kunci jawaban agar tidak bisa klik 2 kali

            // Hapus semua balok yang sedang jatuh
            document.getElementById('answers-container').innerHTML = "";

            const feedback = document.getElementById('feedback-msg');
            feedback.classList.remove('hidden');

            if (isCorrect) {
                benar++;
                score += (100 / questions.length);
                feedback.innerText = "🎉 BENAR!";
                feedback.style.color = "#10b981"; // Hijau
                feedback.style.backgroundColor = "rgba(255, 255, 255, 0.9)";
            } else {
                salah++;
                feedback.innerText = "❌ SALAH!";
                feedback.style.color = "#ef4444"; // Merah
                feedback.style.backgroundColor = "rgba(255, 255, 255, 0.9)";
            }

            document.getElementById('quiz-score').innerText = `Skor: ${Math.round(score)}`;
            
            // Munculkan tombol Lanjut
            setTimeout(() => {
                document.getElementById('btn-next-container').classList.remove('hidden');
            }, 500);
        }

        function soalSelanjutnya() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                tampilkanSoal();
            } else {
                tampilkanHasil();
            }
        }

        function tampilkanHasil() {
            document.getElementById('soal-panel').classList.add('hidden');
            document.getElementById('btn-next-container').classList.add('hidden');
            document.getElementById('feedback-msg').classList.add('hidden');
            
            const resultScreen = document.getElementById('screen-result');
            resultScreen.classList.remove('hidden');

            document.getElementById('result-name').innerText = `Kerja Bagus, ${playerName}!`;
            document.getElementById('result-benar').innerText = benar;
            document.getElementById('result-salah').innerText = salah;
            document.getElementById('result-nilai').innerText = Math.round(score);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuis AR Literasi Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        body { font-family: 'Poppins', sans-serif; margin: 0; overflow: hidden; background-color: #111; }
        
        /* Video Latar (Mirror) */
        #webcam-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; transform: scaleX(-1);
        }

        /* Lapisan Antarmuka */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: none;
        }
        .interactive { pointer-events: auto; }
        .hidden { display: none !important; }

        /* Panel Utama */
        .glass-panel {
            background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(5px); 
            border: 2px solid rgba(56, 189, 248, 0.8); border-radius: 20px;
            width: 90%; max-width: 650px; padding: 30px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); color: #0f172a;
        }

        /* Panel Soal Atas */
        #soal-panel {
            position: absolute; top: 2%; width: 95%; max-width: 1000px;
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(6px);
            border-radius: 15px; padding: 15px 25px;
            border-bottom: 5px solid #0ea5e9; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        .btn {
            background: #0ea5e9; color: white; padding: 15px 30px; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; width: 100%; cursor: pointer; transition: 0.2s;
            border: 2px solid #0284c7; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn:active { transform: scale(0.95); }
        .btn-secondary {
            background: #64748b; border-color: #475569; margin-top: 10px;
        }

        /* Wadah Balok Jatuh */
        #falling-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; overflow: hidden;
        }

        /* Kotak Jawaban (Ramping untuk memuat 5 kotak) */
        .falling-box {
            position: absolute; pointer-events: auto; cursor: pointer;
            background: linear-gradient(135deg, rgba(14,165,233,0.95), rgba(2,132,199,0.95));
            color: white; font-weight: 700; font-size: 0.95rem;
            padding: 10px; border-radius: 12px; text-align: center;
            width: 18%; max-width: 150px; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.8);
            animation: fallAnimation linear infinite;
            display: flex; align-items: center; justify-content: center;
        }
        
        .falling-box.selected {
            background: linear-gradient(135deg, #f59e0b, #b45309) !important;
            border: 3px solid #fef3c7; transform: scale(1.1); z-index: 20;
        }

        @keyframes fallAnimation { 0% { top: -150px; } 100% { top: 110%; } }

        #btn-submit-multiple {
            position: absolute; bottom: 8%; z-index: 25; width: 50%; max-width: 350px;
            background: #10b981; border-color: #047857; font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Video Latar -->
    <video id="webcam-bg" autoplay playsinline muted></video>

    <div id="falling-container"></div>

    <div id="ui-layer">
        
        <!-- Layar Mulai -->
        <div id="screen-start" class="glass-panel interactive">
            <h1 class="text-3xl md:text-4xl font-extrabold text-sky-800 mb-2">Misi Literasi Digital</h1>
            <p class="text-gray-800 font-bold mb-6">Tangkap balok jawaban yang benar di udara layar PID!</p>
            <input type="text" id="input-nama" class="w-full px-4 py-3 border-2 border-sky-400 rounded-xl mb-4 text-center text-lg focus:outline-none" placeholder="Ketik Nama Siswa...">
            <button class="btn" onclick="mulaiGame()">MULAI TANTANGAN</button>
            <button id="btn-switch-cam" class="btn btn-secondary hidden" onclick="switchCamera()">🔄 GANTI KAMERA (PID/LAPTOP)</button>
        </div>

        <!-- Panel Soal -->
        <div id="soal-panel" class="hidden interactive">
            <div class="flex justify-between items-center mb-2 border-b-2 border-sky-300 pb-2">
                <span id="quiz-progress" class="font-bold text-sky-900 bg-sky-200 px-3 py-1 rounded-full text-sm">Soal 1/20</span>
                <span id="quiz-instruksi" class="font-extrabold text-red-600 animate-pulse text-sm md:text-base">TANGKAP 1 JAWABAN</span>
                <span id="quiz-score" class="font-bold text-gray-800 bg-white/70 px-3 py-1 rounded-full text-sm">Skor: 0</span>
            </div>
            <h2 id="question-text" class="text-base md:text-xl font-extrabold text-gray-900 drop-shadow-sm">Memuat soal...</h2>
        </div>

        <!-- Tombol Khusus Multi -->
        <button id="btn-submit-multiple" class="btn hidden interactive" onclick="submitMultiAnswer()">CEK JAWABAN</button>

        <!-- Panel Pembahasan -->
        <div id="screen-feedback" class="glass-panel hidden interactive bg-white/95">
            <h1 id="fb-title" class="text-3xl font-extrabold mb-2">BENAR!</h1>
            <div class="bg-gray-100 p-3 rounded-xl mb-4 border border-gray-300 text-left">
                <p class="text-xs font-bold text-gray-500 mb-1">Jawaban Benar:</p>
                <p id="fb-correct-ans" class="font-bold text-sky-700 mb-2 text-sm">[Jawaban]</p>
                <p class="text-xs font-bold text-gray-500 mb-1">Penjelasan:</p>
                <p id="fb-explanation" class="text-sm text-gray-800 leading-tight">[Penjelasan]</p>
            </div>
            <button class="btn" onclick="soalSelanjutnya()">LANJUT</button>
        </div>

        <!-- Layar Hasil -->
        <div id="screen-result" class="glass-panel hidden interactive bg-white/95">
            <h1 class="text-4xl font-extrabold text-sky-700 mb-2">Misi Selesai!</h1>
            <p class="text-xl font-bold text-gray-700 mb-4">Hebat, <span id="result-name">Siswa</span>!</p>
            
            <div class="flex justify-around mb-4 mt-2">
                <div class="bg-green-100 p-3 rounded-xl w-5/12 border-2 border-green-400">
                    <p class="text-green-800 font-bold text-sm">Benar</p>
                    <p id="result-benar" class="text-3xl font-extrabold text-green-600">0</p>
                </div>
                <div class="bg-red-100 p-3 rounded-xl w-5/12 border-2 border-red-400">
                    <p class="text-red-800 font-bold text-sm">Salah</p>
                    <p id="result-salah" class="text-3xl font-extrabold text-red-600">0</p>
                </div>
            </div>
            
            <div class="bg-sky-100 border-4 border-sky-400 p-3 rounded-2xl mb-4 shadow-inner">
                <p class="text-sky-800 font-bold text-sm">NILAI AKHIR</p>
                <p id="result-nilai" class="text-5xl font-extrabold text-sky-600">100</p>
            </div>
            
            <p id="result-motivasi" class="text-sm font-bold text-gray-600 mb-4 italic">Jadilah murid yang kritis dan kreatif!</p>
            <button class="btn" onclick="location.reload()">MAIN LAGI</button>
        </div>
    </div>

    <script>
        // === SISTEM MANAJEMEN KAMERA ===
        let videoDevices = [];
        let currentDeviceIndex = 0;
        let currentStream = null;

        async function initCamera() {
            try {
                // Izin awal
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                document.getElementById('webcam-bg').srcObject = currentStream;
                
                // Cek jumlah kamera terhubung
                const devices = await navigator.mediaDevices.enumerateDevices();
                videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                if (videoDevices.length > 1) {
                    document.getElementById('btn-switch-cam').classList.remove('hidden');
                }
            } catch (err) { console.warn("Kamera ditolak/error", err); }
        }

        async function switchCamera() {
            if (videoDevices.length < 2) return;
            currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
            const deviceId = videoDevices[currentDeviceIndex].deviceId;

            if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); }
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: deviceId } } });
                document.getElementById('webcam-bg').srcObject = currentStream;
            } catch (err) { console.error("Gagal ganti kamera", err); }
        }
        
        initCamera();

        // === DATABASE SOAL (20 SOAL) ===
        const questions = [
            // Materi 1: Mesin Pencari Lanjutan
            { type: "single", question: "Teknik mencari informasi memanfaatkan kata kunci khusus agar hasil lebih spesifik dibanding pencarian biasa disebut...", options: [{text: "Pencarian Vertikal", correct: false}, {text: "Mesin Pencari Lanjutan", correct: true}, {text: "Membaca Lateral", correct: false}, {text: "Pencarian Anonim", correct: false}, {text: "Penelusuran Gambar", correct: false}], explanation: "Mesin pencari lanjutan menggunakan operator agar pencarian lebih terarah dan efisien." },
            { type: "single", question: "Operator pencarian untuk menampilkan hasil yang memuat SELURUH kata kunci yang dihubungkan adalah...", options: [{text: "OR", correct: false}, {text: "NOT", correct: false}, {text: "AND", correct: true}, {text: "site:", correct: false}, {text: "filetype:", correct: false}], explanation: "Operator AND memastikan semua kata kunci yang dimasukkan muncul dalam hasil pencarian." },
            { type: "single", question: "Jika kamu mencari 'nelayan OR pelaut', mesin pencari akan menampilkan hasil berupa...", options: [{text: "Hanya kata nelayan", correct: false}, {text: "Gabungan nelayan dan pelaut", correct: false}, {text: "Salah satu dari kedua kata tersebut", correct: true}, {text: "Mengecualikan kata pelaut", correct: false}, {text: "Mengecualikan kata nelayan", correct: false}], explanation: "Operator OR akan menampilkan hasil jika situs tersebut memuat salah satu dari kata kunci yang dicari." },
            { type: "single", question: "Untuk mengecualikan kata tertentu dari hasil pencarian, kita menggunakan operator...", options: [{text: "AND", correct: false}, {text: "NOT atau (-)", correct: true}, {text: "site:", correct: false}, {text: "OR", correct: false}, {text: "Tanda Kutip", correct: false}], explanation: "Operator NOT atau tanda minus digunakan agar kata tersebut tidak muncul dalam hasil pencarian." },
            { type: "single", question: "Untuk membatasi hasil pencarian hanya pada situs pemerintah (go.id), format penulisan yang benar adalah...", options: [{text: "harga ikan AND go.id", correct: false}, {text: "harga ikan NOT go.id", correct: false}, {text: "harga ikan site:go.id", correct: true}, {text: "harga ikan OR go.id", correct: false}, {text: "harga ikan -go.id", correct: false}], explanation: "Operator 'site:' berfungsi mengunci mesin pencari hanya pada satu domain tertentu." },
            { type: "multiple", max: 3, question: "Manfaat utama menggunakan operator pencarian bagi murid adalah... (PILIH MAKS 3)", options: [{text: "Memperoleh hasil lebih relevan", correct: true}, {text: "Hemat waktu penelusuran", correct: true}, {text: "Hindari informasi tidak kredibel", correct: true}, {text: "Mendapat akses internet gratis", correct: false}, {text: "Mengubah desain web", correct: false}], explanation: "Operator pencarian membantu menyaring hasil, menghemat waktu, dan menghindari informasi sampah." },
            
            // Materi 2: Membaca Lateral
            { type: "single", question: "Teknik verifikasi informasi dengan membuka sumber lain di luar halaman asal disebut...", options: [{text: "Membaca Lateral", correct: true}, {text: "Membaca Vertikal", correct: false}, {text: "Membaca Cepat", correct: false}, {text: "Mesin Pencari Lanjutan", correct: false}, {text: "Pencarian Domain", correct: false}], explanation: "Membaca lateral membandingkan kebenaran informasi dari berbagai sumber lain secara bersamaan." },
            { type: "single", question: "Langkah PERTAMA dan paling krusial sebelum mempercayai atau membagikan sebuah informasi adalah...", options: [{text: "Buka tab baru", correct: false}, {text: "Selidiki sumber", correct: false}, {text: "Berhenti sejenak", correct: true}, {text: "Telusuri asal-usul", correct: false}, {text: "Simpulkan", correct: false}], explanation: "Berhenti sejenak sangat penting untuk tidak mudah terprovokasi dan menyebarkan hoaks." },
            { type: "single", question: "Membaca sebuah artikel dari atas ke bawah pada halaman yang sama secara berulang disebut teknik...", options: [{text: "Membaca Lateral", correct: false}, {text: "Membaca Vertikal", correct: true}, {text: "Membaca Kritis", correct: false}, {text: "Membaca Sekunder", correct: false}, {text: "Membaca Abstrak", correct: false}], explanation: "Membaca vertikal hanya menelusuri halaman itu sendiri, berbeda dengan lateral yang membuka tab baru." },
            { type: "single", question: "Tahapan 'Buka Tab Baru' dalam teknik membaca lateral bertujuan untuk...", options: [{text: "Mencari sumber pembanding dari situs/media lain", correct: true}, {text: "Mencari penulis artikel tersebut", correct: false}, {text: "Membaca berita tersebut dari awal", correct: false}, {text: "Mengecek gambar terbalik", correct: false}, {text: "Mengunduh file PDF berita", correct: false}], explanation: "Membuka tab baru berfungsi mencari portal berita atau sumber lain yang membahas topik serupa." },
            { type: "multiple", max: 2, question: "Manfaat utama menerapkan teknik Membaca Lateral adalah... (PILIH MAKS 2)", options: [{text: "Mencegah penyebaran Hoaks", correct: true}, {text: "Mengurangi risiko keputusan keliru", correct: true}, {text: "Mempercepat koneksi internet", correct: false}, {text: "Menyembunyikan identitas pembaca", correct: false}, {text: "Mengubah sumber primer", correct: false}], explanation: "Teknik ini mencegah hoaks dan membantu pengambilan keputusan berdasarkan informasi yang valid." },
            { type: "single", question: "Mencari asal klaim, kutipan, atau melakukan pencarian gambar terbalik masuk ke dalam langkah membaca lateral tahap...", options: [{text: "Berhenti Sejenak", correct: false}, {text: "Selidiki Sumber", correct: false}, {text: "Buka Tab Baru", correct: false}, {text: "Telusuri Asal-usul", correct: true}, {text: "Simpulkan", correct: false}], explanation: "Menelusuri asal-usul memastikan bahwa gambar atau kutipan tidak diedit atau diambil dari konteks yang salah." },

            // Materi 3: Mengidentifikasi Sumber Informasi Terpercaya
            { type: "multiple", max: 3, question: "Ciri-ciri sumber informasi yang terpercaya adalah... (PILIH MAKS 3)", options: [{text: "Domain kredibel (.go.id, .ac.id)", correct: true}, {text: "Tanggal publikasi jelas", correct: true}, {text: "Identitas penulis jelas", correct: true}, {text: "Menggunakan bahasa provokatif", correct: false}, {text: "Anonim di media sosial", correct: false}], explanation: "Sumber terpercaya selalu jelas asal-usulnya, tanggal rilisnya, dan menggunakan domain yang resmi." },
            { type: "single", question: "Informasi langsung dari pihak yang mengalami atau berwenang (misal: rilis resmi pemerintah/TPI) disebut...", options: [{text: "Sumber Sekunder", correct: false}, {text: "Sumber Primer", correct: true}, {text: "Sumber Tersier", correct: false}, {text: "Sumber Abstrak", correct: false}, {text: "Sumber Anonim", correct: false}], explanation: "Sumber primer adalah sumber utama atau tangan pertama dari sebuah informasi atau peristiwa." },
            { type: "single", question: "Informasi yang diolah ulang oleh pihak lain, seperti berita di portal media atau blog, disebut...", options: [{text: "Sumber Primer", correct: false}, {text: "Sumber Sekunder", correct: true}, {text: "Sumber Resmi", correct: false}, {text: "Sumber Tidak Resmi", correct: false}, {text: "Sumber Lateral", correct: false}], explanation: "Sumber sekunder mengutip, merangkum, atau menganalisis informasi dari sumber primer." },
            { type: "single", question: "Di antara pilihan berikut, manakah yang termasuk kategori 'Sumber Resmi' yang dapat dipertanggungjawabkan?", options: [{text: "Situs Pemerintah Daerah", correct: true}, {text: "Blog Pribadi Tanpa Nama", correct: false}, {text: "Akun Medsos Anonim", correct: false}, {text: "Komentar Grup WhatsApp", correct: false}, {text: "Pesan Berantai", correct: false}], explanation: "Situs pemerintah daerah adalah sumber resmi karena dikelola langsung oleh instansi berwenang." },
            { type: "single", question: "Blog pribadi anonim atau akun media sosial tak terverifikasi umumnya diklasifikasikan sebagai...", options: [{text: "Sumber Resmi", correct: false}, {text: "Sumber Primer", correct: false}, {text: "Sumber Tidak Resmi", correct: true}, {text: "Sumber Terpercaya", correct: false}, {text: "Sumber Lateral", correct: false}], explanation: "Sumber ini tergolong tidak resmi karena kebenarannya sulit dipertanggungjawabkan." },
            { type: "single", question: "Sebuah artikel tidak mencantumkan data, rujukan, atau narasumber yang jelas. Artikel tersebut terindikasi...", options: [{text: "Kredibel", correct: false}, {text: "Terpercaya", correct: false}, {text: "Kurang Kredibel", correct: true}, {text: "Sumber Resmi", correct: false}, {text: "Sumber Primer", correct: false}], explanation: "Ciri sumber terpercaya adalah selalu mencantumkan data rujukan atau mengutip narasumber yang jelas." },
            { type: "multiple", max: 2, question: "Domain apa yang paling disarankan untuk mendapatkan data akademik dan data pemerintah resmi? (PILIH MAKS 2)", options: [{text: ".go.id", correct: true}, {text: ".ac.id", correct: true}, {text: ".blogspot.com", correct: false}, {text: ".wordpress.com", correct: false}, {text: ".tk", correct: false}], explanation: "Domain .go.id khusus untuk instansi pemerintah Indonesia, dan .ac.id untuk institusi pendidikan tinggi." },
            { type: "single", question: "Mengapa kita tidak boleh mudah percaya dengan informasi yang menggunakan bahasa sensasional/provokatif?", options: [{text: "Biasanya merupakan ciri informasi kurang kredibel", correct: true}, {text: "Karena bahasanya sulit dipahami", correct: false}, {text: "Agar tidak menghabiskan kuota", correct: false}, {text: "Karena itu adalah sumber primer", correct: false}, {text: "Karena itu trik membaca lateral", correct: false}], explanation: "Bahasa sensasional sering dipakai situs tidak resmi atau hoaks untuk memancing klik (clickbait) atau memicu emosi." }
        ];

        // === LOGIKA GAME ===
        let currentQuestion = 0, score = 0, benar = 0, salah = 0, playerName = "", isAnswering = false, selectedBoxes = [];

        function mulaiGame() {
            playerName = document.getElementById('input-nama').value || "Prajurit";
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('soal-panel').classList.remove('hidden');
            
            // Acak urutan soal
            questions.sort(() => Math.random() - 0.5);
            currentQuestion = 0; score = 0; benar = 0; salah = 0;
            tampilkanSoal();
        }

        function tampilkanSoal() {
            isAnswering = true;
            selectedBoxes = [];
            document.getElementById('btn-submit-multiple').classList.add('hidden');
            document.getElementById('screen-feedback').classList.add('hidden');
            
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('quiz-progress').innerText = `Soal ${currentQuestion + 1} / 20`;
            document.getElementById('quiz-score').innerText = `Skor: ${Math.round(score)}`;
            
            const instruksi = document.getElementById('quiz-instruksi');
            if (q.type === 'multiple') {
                instruksi.innerText = `TANGKAP MAKSIMAL ${q.max} JAWABAN`;
                instruksi.className = "font-extrabold text-orange-500 animate-pulse text-sm";
            } else {
                instruksi.innerText = `TANGKAP 1 JAWABAN`;
                instruksi.className = "font-extrabold text-red-600 animate-pulse text-sm";
            }

            const container = document.getElementById('falling-container');
            container.innerHTML = "";
            
            const leftPositions = [2, 22, 42, 62, 82]; 
            const shuffledOptions = q.options.sort(() => Math.random() - 0.5);

            shuffledOptions.forEach((opt, index) => {
                const box = document.createElement('div');
                box.className = "falling-box";
                box.innerText = opt.text;
                
                box.style.left = `${leftPositions[index]}%`; 
                box.style.animationDuration = `${Math.random() * 4 + 7}s`; 
                box.style.animationDelay = `${index * 0.5}s`;

                box.onclick = () => handleBoxClick(box, opt, q);
                container.appendChild(box);
            });
        }

        function handleBoxClick(box, opt, q) {
            if(!isAnswering) return;

            if (q.type === 'single') {
                isAnswering = false;
                evaluasiJawaban([opt.text], q);
            } else {
                if (box.classList.contains('selected')) {
                    box.classList.remove('selected');
                    box.style.animationPlayState = 'running';
                    selectedBoxes = selectedBoxes.filter(b => b.text !== opt.text);
                } else {
                    if (selectedBoxes.length >= q.max) {
                        alert(`Maksimal memilih ${q.max} jawaban!`); return;
                    }
                    box.classList.add('selected');
                    box.style.animationPlayState = 'paused';
                    selectedBoxes.push({ text: opt.text });
                }

                if (selectedBoxes.length > 0) document.getElementById('btn-submit-multiple').classList.remove('hidden');
                else document.getElementById('btn-submit-multiple').classList.add('hidden');
            }
        }

        function submitMultiAnswer() {
            if (!isAnswering) return;
            isAnswering = false;
            document.getElementById('btn-submit-multiple').classList.add('hidden');
            evaluasiJawaban(selectedBoxes.map(s => s.text), questions[currentQuestion]);
        }

        function evaluasiJawaban(jawabanSiswa, q) {
            document.getElementById('falling-container').innerHTML = ""; 
            const kunciJawaban = q.options.filter(o => o.correct).map(o => o.text);
            const isBenar = (jawabanSiswa.length === kunciJawaban.length) && jawabanSiswa.every(j => kunciJawaban.includes(j));

            const fbScreen = document.getElementById('screen-feedback');
            const fbTitle = document.getElementById('fb-title');
            
            fbScreen.classList.remove('hidden');
            document.getElementById('fb-correct-ans').innerText = kunciJawaban.join(" | ");
            document.getElementById('fb-explanation').innerText = q.explanation;

            if (isBenar) {
                benar++; score += 5; // 5 poin x 20 soal = 100
                fbTitle.innerText = "🎉 BENAR!";
                fbTitle.className = "text-3xl font-extrabold mb-2 text-green-600";
            } else {
                salah++;
                fbTitle.innerText = "❌ KURANG TEPAT!";
                fbTitle.className = "text-3xl font-extrabold mb-2 text-red-600";
            }
            document.getElementById('quiz-score').innerText = `Skor: ${Math.round(score)}`;
        }

        function soalSelanjutnya() {
            currentQuestion++;
            if (currentQuestion < 20) { tampilkanSoal(); } 
            else { tampilkanHasil(); }
        }

        function tampilkanHasil() {
            document.getElementById('soal-panel').classList.add('hidden');
            document.getElementById('screen-feedback').classList.add('hidden');
            
            const resultScreen = document.getElementById('screen-result');
            resultScreen.classList.remove('hidden');

            const finalScore = Math.round(score);
            document.getElementById('result-name').innerText = playerName;
            document.getElementById('result-benar').innerText = benar;
            document.getElementById('result-salah').innerText = salah;
            document.getElementById('result-nilai').innerText = finalScore;
            
            let motivasi = "";
            if (finalScore >= 90) motivasi = "Sempurna! Kamu pantas dijuluki Master Literasi Digital.";
            else if (finalScore >= 75) motivasi = "Kerja bagus! Pertahankan sikap kritismu di dunia maya.";
            else motivasi = "Tetap semangat! Jangan ragu untuk mengulang dan belajar lagi.";
            document.getElementById('result-motivasi').innerText = motivasi;
        }
    </script>
</body>
</html>
